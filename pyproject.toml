[project]
name = "ai-video-editor"
version = "0.1.0"
description = "Pipeline de montage vidéo automatique piloté par IA (analyse rushs + beat sync + timeline LLM + rendu Remotion)"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "pillow>=10.3",
    "scenedetect[opencv-headless]>=0.6.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
